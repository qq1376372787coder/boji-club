# BOJI CLUB CI（R-02）· GitHub Actions
#
# 托管：GitHub（2026-11-07 用户确认）。push 到 main/develop、PR、手动触发（workflow_dispatch）均运行。
#
# 任务矩阵：
# · python-offline       — Python 离线回归（原 checks 第 1 步拆出，独立车道独立红绿）
# · ios-suite            — Swift 规则链 + 模拟器编译 + 单元测试 + UI 测试
#                          （含无障碍审计与启动性能采样），macOS
# · action-backend       — AI Action 关键 PHP 回归（5 套件 + capability unittest），MySQL 8.4
# · admin-runtime-integration — 审计 SQL/并发/后台 HTTP 集成，MySQL 8.4
# · php-suite            — PHP 全量套件 tests/run_php_suite.sh（此前只在本地跑，R-02 遗留项）
# · php-subdir-regression— tests/php/ 子目录 4 个测试（R-39：曾被 runner glob 漏掉；首次纳入
#                          先 continue-on-error 非阻塞，全绿稳定一个周期后改为阻断）
# · release-gate         — scripts/check-release-ready.py 发布门禁（当前存在已知阻断项：
#                          缺 ReleaseChecklist.local.plist、LegalReviewed 未确认、隐私政策域名
#                          无解析；先非阻塞以暴露状态，阻断项清零后移除 continue-on-error）
#
# 说明：
# · Xcode 选择：自动取 runner 上版本号最大的 /Applications/Xcode*.app（不硬编码路径）；
#   模拟器目标：iPhone 17 优先，不可用时回退第一台可用 iPhone（scripts/run-all-checks.sh）。
# · 本 workflow 不使用任何 secrets：GitHub PAT 只用于人工 git push，绝不进 workflow/仓库。
# · 本地与 CI 同源：scripts/run-all-checks.sh 与 tests/run_php_suite.sh。

name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  python-offline:
    # 从原 checks 拆出：Python 存量失败不应掩盖 iOS 车道的执行（首跑时
    # run_offline 第一步即退出，Xcode/模拟器问题根本没跑到）。
    # 平台与妙妙的基线一致（macOS），便于失败归因对齐。
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies (must be visible under python3 -I)
        # test_backup_status 需要 cryptography（backup.py AES-256-GCM）。
        # 注意：套件用 python3 -I 跑，-I 不加载 user site——必须装进 system site，
        # 装完用 -I 自检，防止“装了但看不见”。
        run: |
          python3 -I -c "import cryptography" 2>/dev/null && exit 0
          sudo python3 -m pip install cryptography \
            || sudo python3 -m pip install --break-system-packages cryptography \
            || python3 -m pip install --break-system-packages cryptography
          python3 -I -c "import cryptography; print('cryptography visible under -I')"
      - name: Python offline regression
        run: python3 -I tests/run_offline.py

  ios-suite:
    # 原 checks 的 2-5 步：Swift 规则链 + 模拟器编译 + 单元 + UI。
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode (latest installed on runner)
        # 硬编码 /Applications/Xcode_26.app 在 runner 上不存在（首跑失败原因）。
        # 自动选择镜像里版本号最大的 Xcode，并打印版本作为日志证据。
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer" || true
          else
            echo "No /Applications/Xcode*.app found; using preconfigured developer dir"
          fi
          xcodebuild -version
          xcrun simctl list runtimes | head -5 || true
      - name: Run checks (steps 2-5, offline lane split out)
        run: BOJI_SKIP_OFFLINE=1 bash scripts/run-all-checks.sh
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-and-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore

  action-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BOJI_TEST_DSN_BASE: mysql:host=127.0.0.1;port=3306
      BOJI_TEST_DB_USER: root
      BOJI_TEST_DB_PASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Domain commands, action recovery, projections and migration
        run: bash tests/run_action_checks.sh

  admin-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BOJI_TEST_DSN_BASE: mysql:host=127.0.0.1;port=3306
      BOJI_TEST_DB_USER: root
      BOJI_TEST_DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd
          coverage: none
      - name: Install MySQL diagnostic client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Prepare disposable schema and run SQL regressions
        run: |
          php tests/test_audit129_sql.php prepare
          php tests/test_audit129_sql.php check
      - name: Run real concurrent transaction and Admin HTTP integration
        run: python3 tests/test_audit129_runtime.py

  php-suite:
    # R-02 遗留项：PHP 全量套件此前只在交付验证中人工执行，未进 CI。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BOJI_TEST_DSN_BASE: mysql:host=127.0.0.1;port=3306
      BOJI_TEST_DB_USER: root
      BOJI_TEST_DB_PASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd
          coverage: none
      - name: Run full PHP suite (isolated, refuses configured checkout)
        run: bash tests/run_php_suite.sh

  php-subdir-regression:
    # R-39：tests/php/ 下 4 个测试不在 run_php_suite.sh 的 glob（tests/test_*.php）内，静默漏跑。
    # 首次纳入、从未在任何流水线执行过——先非阻塞暴露真实状态；连续全绿一个周期后
    # 移除本行 continue-on-error，改为阻断任务。
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BOJI_TEST_DSN_BASE: mysql:host=127.0.0.1;port=3306
      BOJI_TEST_DB_USER: root
      BOJI_TEST_DB_PASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd
          coverage: none
      - name: Prepare fixture schemas for the four subdir tests
        run: |
          php -r 'require "tests/php_test_bootstrap.php";
          $pdo = new PDO(getenv("BOJI_TEST_DSN_BASE"), getenv("BOJI_TEST_DB_USER") ?: "root", getenv("BOJI_TEST_DB_PASSWORD") ?: "", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          foreach (["bojiclub_automation_test", "bojiclub_media_test"] as $db) {
              $pdo->exec("DROP DATABASE IF EXISTS `$db`");
              $pdo->exec("CREATE DATABASE `$db` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
              bojiTestSchema(bojiTestDatabase($db), "account-server");
          }'
      - name: Run tests/php subdirectory tests (R-39)
        run: |
          BOJI_TEST_DB=bojiclub_automation_test php tests/php/test_automation_terminal.php
          BOJI_TEST_DB=bojiclub_media_test php tests/php/test_media_store_atomic.php
          php tests/php/test_cloud_dictionary_types.php
          php tests/php/test_plan_lifecycle.php

  release-gate:
    # 发布门禁（P0-2 修复版）：真实校验 DNS、签名团队、LegalReviewed、隐私政策 URL 可访问性。
    # 当前已知未通过项为真实发布阻断（见 scripts/check-release-ready.py 输出），故先非阻塞；
    # 阻断项清零后移除本行 continue-on-error，让门禁真正拦住不合规合并/发布。
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Release readiness gate
        run: python3 scripts/check-release-ready.py
