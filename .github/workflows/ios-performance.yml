name: iOS Performance Baseline

run-name: iOS Performance Baseline ${{ inputs.build_id || github.ref_name }}

# 性能基线：在云端 macOS 构建机上跑模拟器性能测试，导出 xcresult + JSON 制品，
# 供测试验收与 2026-10-24 旧基线（docs/native-ui-20261024/performance/）同口径对比。
#
# 触发方式：push tag `ios-perf/<build-id>`，或手动 workflow_dispatch。
on:
  push:
    tags:
      - 'ios-perf/*'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique run identifier'
        required: true
        type: string
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to test (empty tests this branch)'
        required: false
        type: string
        default: ''

jobs:
  performance:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure iOS simulator runtime
        run: |
          set -e
          {
            echo "## 模拟器 runtime 现状"
            echo '```'
            xcrun simctl list runtimes 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if xcrun simctl list runtimes 2>/dev/null | grep -qi "iOS"; then
            echo "已有 iOS runtime"
            exit 0
          fi

          echo "::warning::runner 没有 iOS 模拟器 runtime，开始下载（可能需要几分钟）"
          # macos-latest（arm64）不预装 iOS runtime，必须显式下载。
          xcodebuild -downloadPlatform iOS -exportPath "$RUNNER_TEMP/ios-runtime" || true
          sleep 20

          {
            echo "## 下载后 runtime"
            echo '```'
            xcrun simctl list runtimes 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! xcrun simctl list runtimes 2>/dev/null | grep -qi "iOS"; then
            echo "::error::iOS 模拟器 runtime 下载后仍不可用"
            exit 1
          fi

      - name: Select simulator (iPhone 16 Pro)
        id: sim
        run: |
          set -e
          DEVICES_JSON="$(xcrun simctl list devices available --json)"
          {
            echo "## 可用模拟器"
            echo '```'
            xcrun simctl list devices available 2>&1 || true
            echo '```'
            echo "## Xcode 版本"
            echo '```'
            xcodebuild -version 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 设备口径写死：iPhone 16 Pro（与 2026-11-08 快照同设备；跨设备对比无效）。
          # 先按名字精确取现成设备，没有再退回任意 iPhone，最后按 devicetype 手动建一台。
          UDID=$(printf '%s' "$DEVICES_JSON" | jq -r '
            .devices[]
            | to_entries[]
            | .value[]
            | select(.name == "PerfTest-iPhone" or (.name | test("iPhone 16 Pro")))
            | .udid' | head -1)
          if [ -z "$UDID" ]; then
            echo "::warning::没有 iPhone 16 Pro，退回任意可用的 iPhone"
            UDID=$(printf '%s' "$DEVICES_JSON" | jq -r '
              .devices[]
              | to_entries[]
              | .value[]
              | select(.name | test("iPhone"))
              | .udid' | head -1)
          fi

          # 兜底：runtime 有但一台设备都没建出来，就手动建一台（钉死 iPhone 16 Pro）。
          if [ -z "$UDID" ]; then
            echo "::warning::没有现成设备，尝试手动创建一台 iPhone 16 Pro 模拟器"
            RUNTIME_ID=$(xcrun simctl list runtimes --json | jq -r '
              .runtimes[] | select(.identifier | test("iOS")) | .identifier' | head -1)
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json | jq -r '
              .devicetypes[] | select(.name == "iPhone 16 Pro") | .identifier' | head -1)
            if [ -z "$DEVICE_TYPE" ]; then
              DEVICE_TYPE=$(xcrun simctl list devicetypes --json | jq -r '
                .devicetypes[] | select(.name | test("iPhone 16 Pro|iPhone 15 Pro|iPhone 15|iPhone 14")) | .identifier' | head -1)
            fi
            if [ -n "$RUNTIME_ID" ] && [ -n "$DEVICE_TYPE" ]; then
              UDID=$(xcrun simctl create "PerfTest-iPhone" "$DEVICE_TYPE" "$RUNTIME_ID" 2>/dev/null || true)
            fi
          fi

          if [ -z "$UDID" ]; then
            echo "::error::没有可用的 iPhone 模拟器（runtime 与设备都不可得）"
            exit 1
          fi

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "使用模拟器: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run performance tests
        id: tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # 管道吞退出码会让构建失败假绿（今天已踩两次），必须加 pipefail。
          set -o pipefail
          mkdir -p test-results
          # 先单独构建测试，把构建错误和测试失败分开看；日志落盘便于失败时定位。
          # -only-testing 限定只构建性能用例目标，隔离其他测试目标的问题。
          echo "=== 构建测试目标 ==="
          xcodebuild build-for-testing \
            -project BojiClub.xcodeproj \
            -scheme BojiClub \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:BojiClubUITests/BojiClubPerformanceTests \
            -quiet 2>&1 | tee test-results/build-for-testing.log || {
              echo "::error::build-for-testing 失败，见 Step Summary 的日志尾部"
              tail -40 test-results/build-for-testing.log >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

          echo "=== 运行性能用例 ==="
          xcodebuild test-without-building \
            -project BojiClub.xcodeproj \
            -scheme BojiClub \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:BojiClubUITests/BojiClubPerformanceTests \
            -resultBundlePath test-results/performance.xcresult \
            2>&1 | tee test-results/test-run.log || {
              echo "::error::测试执行失败，见 Step Summary 的日志尾部"
              tail -60 test-results/test-run.log >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Export test results as JSON
        if: always()
        run: |
          set -e
          if [ -d test-results/performance.xcresult ]; then
            xcrun xcresulttool get test-results summary --path test-results/performance.xcresult --format json > test-results/performance-summary.json 2>/dev/null || true
            xcrun xcresulttool get test-results tests --path test-results/performance.xcresult --format json > test-results/performance-tests.json 2>/dev/null || true
            echo "已导出 JSON"
            # 空跑判定：一个用例都没跑到就不算基线（防止管道吞退出码造成的假绿）。
            COUNT=$(jq -r '.totalTestCount // 0' test-results/performance-summary.json 2>/dev/null || echo 0)
            if [ "$COUNT" = "0" ]; then
              echo "::error::性能用例空跑（totalTestCount=0），基线不成立"
              exit 1
            fi
            echo "跑到用例数: $COUNT"
          else
            echo "::error::没有 xcresult 产物，基线不成立"
            exit 1
          fi

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-baseline
          path: test-results/
          retention-days: 30

      - name: Report
        if: always()
        run: |
          echo "## 性能基线结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 模拟器: ${{ steps.sim.outputs.udid }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 结果包: test-results/performance.xcresult（制品已上传）" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/performance-summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/performance-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
