name: iOS Visual Regression

run-name: iOS Visual Regression ${{ github.event.inputs.build_id || github.ref_name }}

# 视觉回归：在云端模拟器上跑 BojiClubUITests/VisualRegressionShots，
# 把 xcresult 里的截图导出成 PNG 并上传制品，供用户 / 设计 / Chief 直接看界面。
# 目的：发货前团队自己先看到界面，不再让用户当第一个看的人。
#
# 触发方式：
#   1) push tag `ios-build/*` —— 跟随每批构建，自动出全页面截图（每批归档）；
#   2) push tag `ios-shots/*` 或 workflow_dispatch —— 单独补跑。
on:
  push:
    tags:
      - 'ios-build/*'
      - 'ios-shots/*'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique run identifier'
        required: true
        type: string
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to test (empty tests this branch)'
        required: false
        type: string
        default: ''

jobs:
  visual:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout working-tree snapshot
        if: github.event.inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ github.event.inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot

      - name: Guard: 截图用例是否已存在
        id: guard
        run: |
          # 按类名识别（不死磕文件名），用例还没建时本轮跳过、不误报红。
          if grep -rq "VisualRegressionShots" BojiClubUITests/ 2>/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "截图用例已在位"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::VisualRegressionShots 用例尚未创建，本轮跳过截图（不影响构建）"
          fi

      - name: Setup Xcode
        if: steps.guard.outputs.skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure iOS simulator runtime
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          if xcrun simctl list runtimes 2>/dev/null | grep -qi "iOS"; then
            echo "已有 iOS runtime"; exit 0
          fi
          echo "::warning::runner 没有 iOS runtime，开始下载"
          xcodebuild -downloadPlatform iOS -exportPath "$RUNNER_TEMP/ios-runtime" || true
          sleep 20
          if ! xcrun simctl list runtimes 2>/dev/null | grep -qi "iOS"; then
            echo "::error::iOS 模拟器 runtime 不可用"; exit 1
          fi

      - name: Select simulator (iPhone 16 Pro)
        if: steps.guard.outputs.skip != 'true'
        id: sim
        run: |
          set -e
          DEVICES_JSON="$(xcrun simctl list devices available --json)"
          UDID=$(printf '%s' "$DEVICES_JSON" | jq -r '
            .devices[] | to_entries[] | .value[]
            | select(.name == "VisualTest-iPhone" or (.name | test("iPhone 16 Pro"))) | .udid' | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(printf '%s' "$DEVICES_JSON" | jq -r '
              .devices[] | to_entries[] | .value[]
              | select(.name | test("iPhone")) | .udid' | head -1)
          fi
          if [ -z "$UDID" ]; then
            RUNTIME_ID=$(xcrun simctl list runtimes --json | jq -r '
              .runtimes[] | select(.identifier | test("iOS")) | .identifier' | head -1)
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json | jq -r '
              .devicetypes[] | select(.name == "iPhone 16 Pro") | .identifier' | head -1)
            if [ -n "$RUNTIME_ID" ] && [ -n "$DEVICE_TYPE" ]; then
              UDID=$(xcrun simctl create "VisualTest-iPhone" "$DEVICE_TYPE" "$RUNTIME_ID" 2>/dev/null || true)
            fi
          fi
          if [ -z "$UDID" ]; then echo "::error::没有可用的 iPhone 模拟器"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "使用模拟器: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run visual regression shots
        if: steps.guard.outputs.skip != 'true'
        id: tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # 管道吞退出码会让失败假绿，必须加 pipefail。
          set -o pipefail
          mkdir -p test-results
          echo "=== 构建测试目标 ==="
          xcodebuild build-for-testing \
            -project BojiClub.xcodeproj \
            -scheme BojiClub \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:BojiClubUITests/VisualRegressionShots \
            -quiet 2>&1 | tee test-results/build-for-testing.log || {
              echo "::error::build-for-testing 失败，见日志尾部"
              tail -40 test-results/build-for-testing.log >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

          echo "=== 运行视觉用例 ==="
          xcodebuild test-without-building \
            -project BojiClub.xcodeproj \
            -scheme BojiClub \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:BojiClubUITests/VisualRegressionShots \
            -resultBundlePath test-results/visual.xcresult \
            2>&1 | tee test-results/test-run.log || {
              echo "::error::视觉用例执行失败，见日志尾部"
              tail -60 test-results/test-run.log >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Export screenshots as PNG
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p test-results/shots
          if [ -d test-results/visual.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path test-results/visual.xcresult \
              --output-path test-results/shots 2>&1 || true

            # 回退：标准导出若没拿到 PNG，直接导出 xcresult 目录树，
            # 按 PNG 魔数（89 50 4E 47）从原始数据里捞图——保证截图不会悄悄为空。
            if [ "$(find test-results/shots -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')" = "0" ]; then
              echo "::warning::附件导出未拿到 PNG，改用目录树魔数扫描回退"
              rm -rf test-results/xcresult-tree
              mkdir -p test-results/xcresult-tree
              xcrun xcresulttool export --type directory \
                --path test-results/visual.xcresult \
                --output-path test-results/xcresult-tree 2>&1 || true
              N=0
              while IFS= read -r f; do
                sig=$(head -c 4 "$f" 2>/dev/null | od -An -tx1 2>/dev/null | tr -d ' \n')
                if [ "$sig" = "89504e47" ]; then
                  N=$((N+1)); cp "$f" "test-results/shots/screenshot-$N.png"
                fi
              done < <(find test-results/xcresult-tree -type f 2>/dev/null)
              echo "回退扫描得到 PNG: $N 张"
            fi

            # 导出文件名默认是 UUID，按 manifest 里的 attachment 名改回可读命名
            # （R{编号}-{页}-{状态}-{亮|暗|AX}.png），方便直接审图。
            if [ -f test-results/shots/manifest.json ]; then
              jq -c '.. | objects | select(has("exportedFileName") and has("fileName")) | {e: .exportedFileName, n: .fileName}' \
                test-results/shots/manifest.json 2>/dev/null | while read -r item; do
                e=$(printf '%s' "$item" | jq -r '.e // empty' 2>/dev/null || true)
                n=$(printf '%s' "$item" | jq -r '.n // empty' 2>/dev/null || true)
                if [ -n "$e" ] && [ -n "$n" ] && [ "$e" != "$n" ] \
                   && [ -f "test-results/shots/$e" ] && [ ! -e "test-results/shots/$n" ]; then
                  mv "test-results/shots/$e" "test-results/shots/$n"
                fi
              done || true
            fi

            COUNT=$(find test-results/shots -type f \( -name '*.png' -o -name '*.jpg' \) | wc -l | tr -d ' ')
            echo "已导出截图: $COUNT 张"
            if [ "$COUNT" = "0" ]; then
              echo "::error::截图导出为空（0 张），请检查用例是否真的挂了截图附件"
            fi
            echo "截图清单" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -1 test-results/shots >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有 xcresult 产物，跳过导出"
          fi

      - name: Upload visual regression shots
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-shots
          path: test-results/shots/
          retention-days: 30
