name: iOS Visual Regression

run-name: iOS Visual Regression ${{ github.event.inputs.build_id || github.ref_name }}

# 视觉回归：在云端模拟器上跑 BojiClubUITests/VisualRegressionShots，
# 把 xcresult 里的截图导出成 PNG 并上传制品，供用户 / 设计 / Chief 直接看界面。
# 目的：发货前团队自己先看到界面，不再让用户当第一个看的人。
#
# 触发方式：
#   1) workflow_run —— 跟随「iOS Build」完成事件，每批构建成功后自动出图。
#      builder 走「工作树快照 + workflow_dispatch」，不产 ios-build/* 标签，
#      所以挂 build 的完成事件，再从 refs/ios-builder/jobs/* 取最新快照来跑。
#   2) push tag `ios-shots/*` 或 workflow_dispatch —— 手动补跑。
on:
  workflow_run:
    workflows: ["iOS Build"]
    types: [completed]
  push:
    tags:
      - 'ios-shots/*'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique run identifier'
        required: true
        type: string
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to test (empty tests this branch)'
        required: false
        type: string
        default: ''

jobs:
  visual:
    # 跟随构建触发时，只在构建成功后出图
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 跟随构建快照
        if: github.event_name == 'workflow_run'
        run: |
          set -e
          # 目标代码版本：优先取「父提交 == 本次构建 main 头」的那个 builder 快照；
          # 取不到就退回构建对应的 main 头（出包前都已提交，内容一致）。
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          TARGET_REF=""
          git fetch --depth=2 origin "+refs/ios-builder/jobs/*:refs/remotes/origin/ios-builder/jobs/*" 2>/dev/null || true
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/ios-builder/jobs/ 2>/dev/null); do
            PARENT=$(git rev-parse --verify "$ref^" 2>/dev/null || true)
            if [ -n "$PARENT" ] && [ "$PARENT" = "$TARGET_SHA" ]; then TARGET_REF="$ref"; break; fi
          done
          if [ -n "$TARGET_REF" ]; then
            echo "使用构建快照: $TARGET_REF"
            git checkout --force "$TARGET_REF"
          else
            echo "未匹配到快照，退回构建对应 main 头: $TARGET_SHA"
            git fetch --depth=1 origin "$TARGET_SHA" 2>/dev/null || true
            git checkout --force "$TARGET_SHA" || git checkout --force origin/main
          fi

      - name: Checkout working-tree snapshot
        if: github.event.inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ github.event.inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot

      - name: 用例守卫
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 按类名识别（不死磕文件名），用例还没建时本轮跳过、不误报红。
          if grep -rq "VisualRegressionShots" BojiClubUITests/ 2>/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "截图用例已在位"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            # 自动跟随构建时找不到用例 = 快照取错了，红线：本轮不算出图
            echo "::error::自动跟随构建时找不到截图用例，快照可能取错——本轮不算出图"
            exit 1
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::VisualRegressionShots 用例尚未创建，本轮跳过截图（不影响构建）"
          fi
          if [ -f BojiClubTests/CrossPageParityTests.swift ]; then
            echo "parity_skip=false" >> "$GITHUB_OUTPUT"
            echo "跨页一致性断言已在位"
          else
            echo "parity_skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::parity 用例未入库，本轮断言层不算过（关账只认步骤状态 success 原文）"
          fi

      - name: Setup Xcode
        if: steps.guard.outputs.skip != 'true' || steps.guard.outputs.parity_skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure iOS simulator runtime
        if: steps.guard.outputs.skip != 'true' || steps.guard.outputs.parity_skip != 'true'
        run: |
          set -e
          if xcrun simctl list runtimes 2>/dev/null | grep -qi "iOS"; then
            echo "已有 iOS runtime"; exit 0
          fi
          echo "::warning::runner 没有 iOS runtime，开始下载"
          xcodebuild -downloadPlatform iOS -exportPath "$RUNNER_TEMP/ios-runtime" || true
          sleep 20
          if ! xcrun simctl list runtimes 2>/dev/null | grep -qi "iOS"; then
            echo "::error::iOS 模拟器 runtime 不可用"; exit 1
          fi

      - name: Select simulator (iPhone 16 Pro)
        if: steps.guard.outputs.skip != 'true' || steps.guard.outputs.parity_skip != 'true'
        id: sim
        run: |
          set -e
          DEVICES_JSON="$(xcrun simctl list devices available --json)"
          UDID=$(printf '%s' "$DEVICES_JSON" | jq -r '
            .devices[] | to_entries[] | .value[]
            | select(.name == "VisualTest-iPhone" or (.name | test("iPhone 16 Pro"))) | .udid' | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(printf '%s' "$DEVICES_JSON" | jq -r '
              .devices[] | to_entries[] | .value[]
              | select(.name | test("iPhone")) | .udid' | head -1)
          fi
          if [ -z "$UDID" ]; then
            RUNTIME_ID=$(xcrun simctl list runtimes --json | jq -r '
              .runtimes[] | select(.identifier | test("iOS")) | .identifier' | head -1)
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json | jq -r '
              .devicetypes[] | select(.name == "iPhone 16 Pro") | .identifier' | head -1)
            if [ -n "$RUNTIME_ID" ] && [ -n "$DEVICE_TYPE" ]; then
              UDID=$(xcrun simctl create "VisualTest-iPhone" "$DEVICE_TYPE" "$RUNTIME_ID" 2>/dev/null || true)
            fi
          fi
          if [ -z "$UDID" ]; then echo "::error::没有可用的 iPhone 模拟器"; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "使用模拟器: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: 跨页一致性断言 + 状态分契约
        id: parity
        if: steps.guard.outputs.parity_skip != 'true'
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # 数字统一的机器化卡口：红一条 = 本批不许过（测试验收 定的口径）。
          # 两个类同在 BojiClubTests 目标：跨页一致性 21 条 + 状态分契约 7 条，
          # 少跑一个类「10 用例全绿」的账就少半本（2026-11-09 补）。
          # mkdir -p 不能省：tee 写不出文件时 pipefail 会把真绿误报成红（2026-11-09 修）。
          mkdir -p test-results
          set -o pipefail
          xcodebuild test \
            -project BojiClub.xcodeproj \
            -scheme BojiClub \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:BojiClubTests/CrossPageParityTests \
            -only-testing:BojiClubTests/ReadinessScoreContractTests \
            -resultBundlePath test-results/parity.xcresult \
            2>&1 | tee test-results/parity-run.log || {
              echo "::error::跨页一致性断言失败（红一条不许关单）"
              tail -60 test-results/parity-run.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              exit 1
            }

      - name: Run visual regression shots
        if: always() && steps.guard.outputs.skip != 'true'
        id: tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # 管道吞退出码会让失败假绿，必须加 pipefail。
          set -o pipefail
          mkdir -p test-results
          # 优先用只含 UI 测试的专用 scheme；当前代码树没有它时（构建早于该 scheme 入库）
          # 回退主 scheme——至少能出图，并在 Summary 里标明实际用了哪个。
          SCHEME="BojiClub-VisualRegression"
          if ! xcodebuild -project BojiClub.xcodeproj -list 2>/dev/null | grep -q "$SCHEME"; then
            echo "::warning::当前代码树无 $SCHEME scheme，回退主 scheme BojiClub（BojiClubTests 编译错可能连坐）"
            SCHEME="BojiClub"
          fi
          echo "使用 scheme: $SCHEME" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "=== 构建测试目标 ==="
          # 只构建截图用例目标：build-for-testing 默认会编整个 scheme 的测试目标，
          # 只要 BojiClubTests 有编译错（哪怕与截图无关）就会连带挂掉截图构建。
          xcodebuild build-for-testing \
            -project BojiClub.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:BojiClubUITests/VisualRegressionShots \
            -quiet 2>&1 | tee test-results/build-for-testing.log || {
              echo "::error::build-for-testing 失败，见日志尾部"
              tail -40 test-results/build-for-testing.log >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

          echo "=== 运行视觉用例 ==="
          xcodebuild test-without-building \
            -project BojiClub.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:BojiClubUITests/VisualRegressionShots \
            -resultBundlePath test-results/visual.xcresult \
            2>&1 | tee test-results/test-run.log || {
              echo "::error::视觉用例执行失败，见日志尾部"
              tail -60 test-results/test-run.log >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Export screenshots as PNG
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p test-results/shots
          if [ -d test-results/visual.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path test-results/visual.xcresult \
              --output-path test-results/shots 2>&1 || true

            # 回退：标准导出若没拿到 PNG，直接导出 xcresult 目录树，
            # 按 PNG 魔数（89 50 4E 47）从原始数据里捞图——保证截图不会悄悄为空。
            if [ "$(find test-results/shots -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')" = "0" ]; then
              echo "::warning::附件导出未拿到 PNG，改用目录树魔数扫描回退"
              rm -rf test-results/xcresult-tree
              mkdir -p test-results/xcresult-tree
              xcrun xcresulttool export --type directory \
                --path test-results/visual.xcresult \
                --output-path test-results/xcresult-tree 2>&1 || true
              N=0
              while IFS= read -r f; do
                sig=$(head -c 4 "$f" 2>/dev/null | od -An -tx1 2>/dev/null | tr -d ' \n')
                if [ "$sig" = "89504e47" ]; then
                  N=$((N+1)); cp "$f" "test-results/shots/screenshot-$N.png"
                fi
              done < <(find test-results/xcresult-tree -type f 2>/dev/null)
              echo "回退扫描得到 PNG: $N 张"
            fi

            # 导出文件名默认是 UUID，按 manifest 里的 suggestedHumanReadableName
            # 改回可读命名（R{编号}-{页}-{状态}-{亮|暗|AX}.png），方便直接审图。
            if [ -f test-results/shots/manifest.json ]; then
              jq -c '.. | objects | select(has("exportedFileName") and has("suggestedHumanReadableName")) | {e: .exportedFileName, n: .suggestedHumanReadableName}' \
                test-results/shots/manifest.json 2>/dev/null | while read -r item; do
                e=$(printf '%s' "$item" | jq -r '.e // empty' 2>/dev/null || true)
                # Apple 会在名后追加 _<序号>_<UUID>，去掉这截只留可读名
                n=$(printf '%s' "$item" | jq -r '.n // empty' 2>/dev/null | sed -E 's/_[0-9]+_[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}(\.[A-Za-z0-9]+)$/\1/' || true)
                if [ -n "$e" ] && [ -n "$n" ] && [ "$e" != "$n" ] \
                   && [ -f "test-results/shots/$e" ] && [ ! -e "test-results/shots/$n" ]; then
                  mv "test-results/shots/$e" "test-results/shots/$n"
                fi
              done || true
            fi

            # 清洗文件名里的非法字符（引号/冒号/星号/尖括号/竖线）：
            # 诊断附件名会带 `Debug description for "v2-home-primary" Any.txt`
            # 这种引号，upload-artifact 会因非法路径拒收整包（2026-11-09 修，
            # 苹果开发在用例侧也清洗，这里是导出侧的兜底）。
            # 用 tr+sed 而不是 heredoc：YAML 块会剥掉缩进，heredoc 终止符落不到行首，
            # 会把整个脚本文法搞挂（66afaac 踩过，70cc30e 修）。
            find test-results/shots -depth -print 2>/dev/null | while IFS= read -r f; do
              base=$(basename "$f")
              clean=$(printf '%s' "$base" | tr -d '\001-\037\177' | sed -E 's/["*:?<>|\\]/_/g')
              if [ -n "$clean" ] && [ "$clean" != "$base" ]; then
                mv -- "$f" "$(dirname "$f")/$clean" 2>/dev/null || true
              fi
            done

            COUNT=$(find test-results/shots -type f \( -name '*.png' -o -name '*.jpg' \) | wc -l | tr -d ' ')
            echo "已导出截图: $COUNT 张"
            if [ "$COUNT" = "0" ]; then
              echo "::error::截图导出为空（0 张），请检查用例是否真的挂了截图附件"
            fi
            echo "截图清单" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -1 test-results/shots >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有 xcresult 产物，跳过导出"
          fi

      - name: 生成 R 编号清单
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          # 出图对账：列出实际到图的 R 编号，并标出 R01–R28 里缺的，
          # 缺页=覆盖缺口，不许默默少图（测试验收 按编号对账）。
          cd test-results/shots
          SNAPSHOT_COMMIT=$(git rev-parse HEAD)
          ls -1 *.png 2>/dev/null | sed -E 's/^(R[0-9]+[a-z]?)-.*/\1/' | sort -u -V > /tmp/have.txt || true
          # 同一 R 编号可能有多张（如 R03 拆滚动 100/200 两态），按张数列出去重编号
          ls -1 *.png 2>/dev/null | sed -E 's/^(R[0-9]+[a-z]?)-.*/\1/' | sort -V | uniq -c > /tmp/counts.txt || true
          MISSING=""
          for i in $(seq -w 1 28); do
            grep -q "^R$i" /tmp/have.txt 2>/dev/null || MISSING="$MISSING R$i"
          done
          {
            echo "# 截图 R 编号清单"
            echo ""
            echo "- 实际导出 PNG: $(ls -1 *.png 2>/dev/null | wc -l | tr -d ' ') 张"
            echo "- 覆盖 R 编号: $(wc -l < /tmp/have.txt | tr -d ' ') 个"
            if [ -n "$MISSING" ]; then
              echo "- 缺失 R 编号: ❌$MISSING"
            else
              echo "- 缺失 R 编号: 无（0 缺）"
            fi
            echo "- parity 步骤状态: ${{ steps.parity.conclusion }}"
            echo "- snapshot_commit: $SNAPSHOT_COMMIT"
            echo ""
            echo "## 已到编号（括号内为张数，同编号多态会 >1）"
            echo '```'
            if [ -s /tmp/counts.txt ]; then cat /tmp/counts.txt; else echo "（无）"; fi
            echo '```'
            echo ""
            echo "## R01–R28 中缺失"
            echo '```'
            if [ -n "$MISSING" ]; then echo "$MISSING"; else echo "（无）"; fi
            echo '```'
          } > R-manifest.md
          cat R-manifest.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$MISSING" ]; then
            echo "::warning::R 编号缺图：$MISSING ——审图前先对编号账，缺页=覆盖缺口"
          fi

      - name: Upload visual regression shots
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-shots
          path: test-results/shots/
          retention-days: 30
