location = /admin { return 302 /admin/; }
location = /admin/style.css {
    alias /opt/bojiclub-account/admin/style.css;
    add_header X-Content-Type-Options nosniff always;
}
location = /admin/app.js {
    alias /opt/bojiclub-account/admin/app.js;
    add_header X-Content-Type-Options nosniff always;
}
location = /admin/ {
    client_max_body_size 32m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/bojiclub-account/admin/index.php;
    fastcgi_param SCRIPT_NAME /admin/index.php;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    fastcgi_hide_header X-Powered-By;
}
location ^~ /admin/ { return 404; }
