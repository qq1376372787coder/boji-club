# Private feedback attachment uploads (bounded to 20 MB by PHP).
location ^~ /account/v1/me/feedback/attachments/ {
    limit_req zone=bojiclub_api burst=10 nodelay;
    client_max_body_size 22m;
    client_body_timeout 120s;
    fastcgi_read_timeout 180s;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/bojiclub-account/public/index.php;
    fastcgi_param SCRIPT_NAME /account/v1/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    fastcgi_hide_header X-Powered-By;
}
location ^~ /account/v1/ {
    limit_req zone=bojiclub_api burst=10 nodelay;
    client_max_body_size 18m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/bojiclub-account/public/index.php;
    fastcgi_param SCRIPT_NAME /account/v1/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    fastcgi_hide_header X-Powered-By;
}
