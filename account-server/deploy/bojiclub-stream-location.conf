# The account prefix must use `location /account/v1/`, without ^~, so this
# specific regex can select the isolated pool. Other API requests stay there.
location ~* "^/account/v1/me/ai/runs/[0-9a-f-]{36}/events$" {
    limit_req zone=bojiclub_api burst=10 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/bojiclub-account/public/index.php;
    fastcgi_param SCRIPT_NAME /account/v1/index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php-fpm/bojiclub-stream.sock;
    fastcgi_buffering off;
    fastcgi_read_timeout 40s;
    fastcgi_hide_header X-Powered-By;
    gzip off;
}
