; Isolate long SSE subscriptions from login, commands and cancellation requests.
[bojiclub-stream]
user = nginx
group = nginx
listen = /run/php-fpm/bojiclub-stream.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
listen.backlog = 32
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 200
request_terminate_timeout = 40s
php_admin_value[memory_limit] = 64M
php_admin_flag[display_errors] = off
security.limit_extensions = .php
